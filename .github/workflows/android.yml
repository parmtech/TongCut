name: TongCut Source Checks (No APK)
on:
  push:
    branches: [main, development/capcut-parity]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager not installed"; exit 1; }
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Guard Kotlin source integrity
        run: python3 tools/ci/check_kotlin_sources.py
      - name: Compile, unit tests and Android Lint (NO APK packaging)
        run: gradle --no-daemon testDebugUnitTest lintDebug
# Owner release policy: do not add assembleDebug, assembleRelease,
# bundleRelease, upload-artifact APK steps or automated publishing until
# full CapCut 19.8.0 parity matrix and TongCut extra feature gates pass.
